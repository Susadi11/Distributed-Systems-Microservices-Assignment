version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  authservice:
    build: ./authservice
    container_name: authservice
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/your-db-name
    depends_on:
      - mongo

volumes:
  mongo-data:
